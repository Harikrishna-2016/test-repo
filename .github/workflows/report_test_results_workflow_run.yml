name: Report test results

on:
  workflow_run:
    workflows:
      - PR
    types:
      - completed

permissions:
  actions: read
  checks: write
  pull-requests: write

jobs:
  report_test_results:
    name: Report test results
    runs-on: ubuntu-latest

    steps:
      - name: Download test results
        uses: dawidd6/action-download-artifact@b16db5a4ab2d2eaaace4f0d6f7c5ab1d955b8098 # v9

        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: test_results_*

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0

        if: always()
        with:
          files: "**/*.xml"
